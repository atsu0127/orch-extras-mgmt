name: CI

on:
  pull_request:
  push:
    branches: [main]

# 同じ参照に新しい push があれば古い実行を打ち切る
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # mise.toml で固定した Node と pnpm をそのまま使う
      - uses: jdx/mise-action@v4

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: pnpm typecheck

      - run: pnpm test
