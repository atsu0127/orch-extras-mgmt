name: CI

# main への push は Deploy 側で同じ検査を行うため、ここでは PR だけを見る
on:
  pull_request:

# 同じ PR に新しい push があれば古い実行を打ち切る
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # mise.toml で固定した Node と pnpm をそのまま使う
      - uses: jdx/mise-action@v4

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: pnpm typecheck

      - run: pnpm test
